openapi: 3.1.0
info:
  title: TSITA GEST × BSCA Bank — API
  version: v1
  description: |
    API REST de TSITA GEST, outil de gestion des réclamations clients de BSCA Bank
    (contrat de référence : `docs/ARCHITECTURE.md` §9). **Toutes les données sont fictives**
    (démonstration) : aucun chiffre ni client réel BSCA.

    ## Authentification (Laravel Sanctum, mode SPA par cookie)
    1. Appeler `GET /sanctum/csrf-cookie` (hors préfixe `/api/v1`, à la racine du serveur) :
       le serveur pose le cookie `XSRF-TOKEN`.
    2. Envoyer, sur **chaque** requête modifiante (POST/PATCH/DELETE), l'en-tête `X-XSRF-TOKEN`
       contenant la valeur (décodée URL) du cookie `XSRF-TOKEN`, avec les cookies (`withCredentials`).
    3. `POST /auth/login` ouvre la session : cookie httpOnly `tsita-gest-session` (SameSite=Lax),
       régénéré à la connexion, expiration après 30 min d'inactivité.

    Les routes `/public/*`, `/auth/login`, `/auth/forgot-password` et `/auth/reset-password`
    ne nécessitent pas de session (le jeton CSRF reste requis pour les POST issus du navigateur).

    ## Conventions
    - Ressources enveloppées `{ "data": … }` ; listes paginées
      `{ "data": [...], "meta": { "current_page", "last_page", "per_page", "total" } }`.
    - Dates-heures : ISO 8601 **avec décalage `+01:00`** (fuseau `Africa/Brazzaville`, sans heure
      d'été ; stockage UTC). Dates seules : `AAAA-MM-JJ` (jour local).
    - Montants : chaîne décimale à 2 décimales (`"150000.00"`) ou `null` (jamais `0` par défaut),
      toujours accompagnés d'une devise ISO 4217 (`XAF` par défaut, `EUR`, `USD`, `CNY`, `XOF`) ou `null`.
    - Erreurs : `401 {message}`, `403 {message}`, `404 {message}`, `422 {message, errors:{champ:[..]}}`,
      `429 {message}`. Les règles métier non respectées renvoient aussi 422 (clé `general` si aucun champ).
    - Autorisations : permission du rôle (voir `x-permissions` sur chaque opération) **et** périmètre
      (agence / entité / propriété du dossier), appliqués côté serveur.
    - Limitation de débit : login / mot de passe oublié / réinitialisation / confirmation MFA
      5 req/min par (email + IP) ; portail public 10 req/min par IP ; API authentifiée (interne et client)
      180 req/min par utilisateur.

    ## Matrice rôles → permissions (`app/Enums/Role.php`)
    | Rôle | Permissions |
    |---|---|
    | `client` | aucune (espace `/client/*` seulement) |
    | `agent_accueil` | complaints.view, complaints.create, complaints.reopen, dashboard.view, deadlines.view |
    | `gestionnaire` | complaints.view/create/qualify/transition/respond/reopen/export, solutions.propose, dashboard.view, deadlines.view |
    | `responsable` | idem gestionnaire + complaints.assign, solutions.approve_n1, reports.view |
    | `qualite` | complaints.view, complaints.export, quality.manage, quality.control, reports.view, dashboard.view, deadlines.view |
    | `conformite` | complaints.view, complaints.export, solutions.approve_n2, reports.view, reports.validate, dashboard.view, deadlines.view, admin.rules.validate, admin.audit |
    | `direction` | complaints.view, dashboard.view, reports.view, deadlines.view (noms masqués, pas de pièces ni d'échanges) |
    | `admin` | admin.users, admin.referentials, admin.rules, admin.audit, admin.imports |
servers:
  - url: http://127.0.0.1:8010/api/v1
    description: Back-end Laravel local (php artisan serve)
  - url: http://localhost:5180/api/v1
    description: Front Vite local (proxy /api et /sanctum vers 127.0.0.1:8010, même origine)
security:
  - sessionCookie: []
    xsrfToken: []
tags:
  - name: Auth
    description: Authentification, session, MFA (TOTP) et mot de passe.
  - name: Public
    description: Portail client sans compte (référence + code de suivi). Throttle 10/min/IP.
  - name: Client
    description: Espace client connecté (rôle `client`) — vue client filtrée.
  - name: Référentiels
    description: Référentiels internes pour les collaborateurs.
  - name: Réclamations
    description: Liste, saisie, consultation, qualification et export des dossiers.
  - name: Actions dossier
    description: Actions métier sur un dossier (workflow, affectation, messages, pièces, etc.).
  - name: Pièces jointes
  - name: Tâches
  - name: Solutions
    description: Propositions de solution versionnées et circuit d'approbation N1/N2.
  - name: Pilotage
    description: Tableau de bord, échéances, rapports.
  - name: Qualité
    description: Plans d'action qualité et regroupements récurrents.
  - name: Admin — Utilisateurs
  - name: Admin — Référentiels
  - name: Admin — Règles de délai
  - name: Admin — Journal d'audit
  - name: Admin — Imports

paths:
  # ------------------------------------------------------------------ Auth
  /auth/login:
    post:
      tags: [Auth]
      operationId: authLogin
      summary: Connexion (ouvre la session)
      description: |
        Vérifie les identifiants. Si la MFA est activée sur le compte et que `mfa_code` est absent,
        renvoie `200 {mfa_required: true}` sans ouvrir de session. Verrouillage 15 min après
        10 échecs consécutifs. Throttle 5/min par (email + IP).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 'Connecté (`{data: User}`) ou second facteur requis (`{mfa_required: true}`).'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/UserEnvelope'
                  - $ref: '#/components/schemas/MfaRequired'
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422':
          description: Identifiants invalides, compte verrouillé ou code MFA invalide.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyLogin' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: authLogout
      summary: Déconnexion (invalide la session)
      responses:
        '204': { description: Session invalidée. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/me:
    get:
      tags: [Auth]
      operationId: authMe
      summary: Utilisateur courant et ses permissions
      responses:
        '200':
          description: Utilisateur connecté.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: authForgotPassword
      summary: Demande de lien de réinitialisation
      description: Réponse neutre et identique, que le compte existe ou non. Throttle 5/min.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 190 }
      responses:
        '200':
          description: Message neutre.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyLogin' }
  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: authResetPassword
      summary: Réinitialisation du mot de passe
      description: Mot de passe ≥ 12 caractères, majuscule, minuscule, chiffre et symbole. Throttle 5/min.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token: { type: string, maxLength: 255 }
                email: { type: string, format: email, maxLength: 190 }
                password: { type: string, minLength: 12, maxLength: 255, format: password }
                password_confirmation: { type: string, format: password }
      responses:
        '200':
          description: Mot de passe réinitialisé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '422':
          description: Validation échouée ou lien invalide/expiré (`errors.token`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyLogin' }
  /auth/mfa/setup:
    post:
      tags: [Auth]
      operationId: authMfaSetup
      summary: Initialiser la double authentification (TOTP)
      description: Génère un secret TOTP (RFC 6238, 30 s, 6 chiffres). La MFA n'est active qu'après `/auth/mfa/confirm`.
      responses:
        '200':
          description: Secret et URL otpauth à afficher en QR code.
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauth_url]
                properties:
                  secret: { type: string, description: Secret base32. }
                  otpauth_url: { type: string, example: 'otpauth://totp/TSITA%20GEST:agent@example.test?secret=…' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: MFA déjà activée (`{message}` sans `errors`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/mfa/confirm:
    post:
      tags: [Auth]
      operationId: authMfaConfirm
      summary: Confirmer et activer la MFA
      description: Throttle 5/min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^\d{6}$' }
      responses:
        '200':
          description: MFA activée ; utilisateur à jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyLogin' }

  # ------------------------------------------------------------------ Public
  /public/referentials:
    get:
      tags: [Public]
      operationId: publicReferentials
      summary: Référentiels du formulaire public (libellés seulement)
      security: []
      responses:
        '200':
          description: Catégories, produits, agences actifs et canaux de réponse.
          content:
            application/json:
              schema:
                type: object
                required: [categories, products, channels_reply, agencies]
                properties:
                  categories:
                    type: array
                    items: { $ref: '#/components/schemas/IdLabel' }
                  products:
                    type: array
                    items: { $ref: '#/components/schemas/IdLabel' }
                  channels_reply:
                    type: array
                    items: { $ref: '#/components/schemas/ReplyChannel' }
                  agencies:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        city: { type: string }
        '429': { $ref: '#/components/responses/TooManyPublic' }
  /public/complaints:
    post:
      tags: [Public]
      operationId: publicCreateComplaint
      summary: Déposer une réclamation (sans compte)
      description: |
        Le `tracking_code` n'est renvoyé qu'une seule fois (seul son hash est stocké).
        Pièces : ≤ 5 fichiers, ≤ 10 Mo chacun, pdf/jpg/jpeg/png.
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/PublicComplaintRequest' }
            encoding:
              attachments[]:
                contentType: application/pdf, image/jpeg, image/png
      responses:
        '201':
          description: Réclamation enregistrée.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PublicComplaintConfirmation' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyPublic' }
  /public/track:
    post:
      tags: [Public]
      operationId: publicTrack
      summary: Consulter un dossier (référence + code de suivi)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrackRequest' }
      responses:
        '200':
          description: Vue client filtrée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientComplaintViewEnvelope' }
        '404': { $ref: '#/components/responses/TrackNotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429':
          description: "Throttle 10/min/IP, ou référence verrouillée après 5 échecs de code (verrouillage progressif 15 min → 24 h, en-tête Retry-After), ou IP bloquée après 30 échecs/heure. Message neutre identique que la référence existe ou non : « Trop de tentatives pour ce dossier. Réessayez plus tard. »"
  /public/track/messages:
    post:
      tags: [Public]
      operationId: publicTrackMessage
      summary: Envoyer un message sécurisé au service réclamations
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TrackRequest'
                - type: object
                  required: [body]
                  properties:
                    body: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        '201':
          description: Message enregistré ; vue client à jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientComplaintViewEnvelope' }
        '404': { $ref: '#/components/responses/TrackNotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyPublic' }
  /public/track/attachments:
    post:
      tags: [Public]
      operationId: publicTrackAttachment
      summary: Transmettre un document
      description: Pièce classée `client`, visible du client. 20 documents client maximum par dossier.
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/TrackRequest'
                - type: object
                  required: [file]
                  properties:
                    file: { type: string, format: binary, description: 'pdf, jpg, jpeg, png ; ≤ 10 Mo' }
      responses:
        '201':
          description: Document reçu ; vue client à jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientComplaintViewEnvelope' }
        '404': { $ref: '#/components/responses/TrackNotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyPublic' }
  /public/track/reopen:
    post:
      tags: [Public]
      operationId: publicTrackReopen
      summary: Demander la réouverture (crée un dossier enfant)
      description: Crée un dossier enfant au statut `reouvert` lié par `parent_complaint_id`, avec un nouveau code de suivi.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TrackRequest'
                - type: object
                  required: [reason]
                  properties:
                    reason: { type: string, minLength: 10, maxLength: 2000 }
      responses:
        '201':
          description: Dossier enfant créé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReopenConfirmationEnvelope' }
        '404': { $ref: '#/components/responses/TrackNotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyPublic' }

  # ------------------------------------------------------------------ Client
  /client/complaints:
    get:
      tags: [Client]
      operationId: clientListComplaints
      summary: Mes réclamations (vue résumée)
      description: Rôle `client` uniquement ; 200 dossiers maximum, triés par réception décroissante (non paginé).
      x-permissions: ['rôle client']
      responses:
        '200':
          description: Liste résumée.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ClientComplaintSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyApi' }
  /client/complaints/{reference}:
    get:
      tags: [Client]
      operationId: clientShowComplaint
      summary: Détail d'une de mes réclamations (vue client)
      x-permissions: ['rôle client']
      parameters:
        - $ref: '#/components/parameters/ClientReference'
      responses:
        '200':
          description: Vue client filtrée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientComplaintViewEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ClientNotFound' }
        '429': { $ref: '#/components/responses/TooManyApi' }

  /client/complaints/{reference}/messages:
    post:
      tags: [Client]
      operationId: clientComplaintMessage
      summary: Envoyer un message sur un de mes dossiers
      x-permissions: ['rôle client']
      parameters:
        - $ref: '#/components/parameters/ClientReference'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        '201':
          description: Message enregistré ; vue client à jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientComplaintViewEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ClientNotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyApi' }
  /client/complaints/{reference}/attachments:
    post:
      tags: [Client]
      operationId: clientComplaintAttachment
      summary: Transmettre un document sur un de mes dossiers
      description: Pièce classée `client`, visible du client. 20 documents client maximum par dossier (422 au-delà).
      x-permissions: ['rôle client']
      parameters:
        - $ref: '#/components/parameters/ClientReference'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 'pdf, jpg, jpeg, png ; ≤ 10 Mo' }
      responses:
        '201':
          description: Document reçu ; vue client à jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientComplaintViewEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ClientNotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyApi' }
  /client/complaints/{reference}/reopen:
    post:
      tags: [Client]
      operationId: clientComplaintReopen
      summary: Demander la réouverture d'un de mes dossiers (dossier enfant)
      x-permissions: ['rôle client']
      parameters:
        - $ref: '#/components/parameters/ClientReference'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 2000 }
      responses:
        '201':
          description: Dossier enfant créé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReopenConfirmationEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ClientNotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyApi' }

  # ------------------------------------------------------------------ Interne
  /referentials:
    get:
      tags: [Référentiels]
      operationId: referentials
      summary: Référentiels internes
      description: Accessible à tout collaborateur actif (rôle ≠ client).
      x-permissions: ['collaborateur (staff)']
      responses:
        '200':
          description: Référentiels complets (y compris inactifs) et énumérations libellées.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalReferentials' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyApi' }

  /customers:
    get:
      tags: [Référentiels]
      operationId: searchCustomers
      summary: Rechercher un client (rattachement lors d'une saisie agent)
      description: |
        Recherche sur le nom, l'email ou (≥ 4 chiffres) le téléphone ; 20 résultats maximum, tri par nom.
        Numéro client masqué (4 derniers caractères visibles). Recherche journalisée (`customer.search`).
      x-permissions: [complaints.create]
      parameters:
        - name: search
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
      responses:
        '200':
          description: Clients correspondants.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    maxItems: 20
                    items: { $ref: '#/components/schemas/CustomerSearchItem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyApi' }

  /complaints/export:
    get:
      tags: [Réclamations]
      operationId: exportComplaints
      summary: Exporter la liste des réclamations (CSV / XLSX / PDF)
      description: |
        Mêmes filtres que la liste (10 000 lignes max). En-tête du fichier : période, filtres, date de calcul,
        version de règle, utilisateur. Chaque export est journalisé (`exports` + audit). CSV : séparateur `;`, BOM UTF-8,
        neutralisation des formules.
      x-permissions: [complaints.export]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/AgencyId'
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/DeadlineFlagFilter'
        - $ref: '#/components/parameters/OwnerId'
        - $ref: '#/components/parameters/Mine'
        - $ref: '#/components/parameters/Sort'
        - name: format
          in: query
          description: Format du fichier (défaut `csv`).
          schema:
            $ref: '#/components/schemas/ExportFormat'
            default: csv
      responses:
        '200': { $ref: '#/components/responses/ExportFile' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyApi' }
  /complaints:
    get:
      tags: [Réclamations]
      operationId: listComplaints
      summary: Liste paginée des réclamations du périmètre
      x-permissions: [complaints.view]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/AgencyId'
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/DeadlineFlagFilter'
        - $ref: '#/components/parameters/OwnerId'
        - $ref: '#/components/parameters/Mine'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Page de dossiers.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ComplaintListItem' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyApi' }
    post:
      tags: [Réclamations]
      operationId: createComplaint
      summary: Saisie omnicanale d'une réclamation par un agent
      description: Le code de suivi du client est renvoyé une seule fois dans `meta.tracking_code`.
      x-permissions: [complaints.create]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/StoreComplaintRequest' }
          application/json:
            schema: { $ref: '#/components/schemas/StoreComplaintRequest' }
      responses:
        '201':
          description: Dossier créé.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ComplaintDetailEnvelope'
                  - type: object
                    required: [meta]
                    properties:
                      meta:
                        type: object
                        required: [tracking_code]
                        properties:
                          tracking_code: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyApi' }
  /complaints/{complaint}:
    parameters:
      - $ref: '#/components/parameters/ComplaintId'
    get:
      tags: [Réclamations]
      operationId: showComplaint
      summary: Détail d'un dossier (consultation journalisée)
      description: Pour la direction, données nominatives masquées et `attachments`, `messages`, `audit` vides.
      x-permissions: [complaints.view]
      responses:
        '200': { $ref: '#/components/responses/ComplaintDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyApi' }
    patch:
      tags: [Réclamations]
      operationId: qualifyComplaint
      summary: Qualifier un dossier (audit avant/après)
      x-permissions: [complaints.qualify]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QualifyComplaintRequest' }
      responses:
        '200': { $ref: '#/components/responses/ComplaintDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyApi' }

  /complaints/{complaint}/transition:
    parameters:
      - $ref: '#/components/parameters/ComplaintId'
    post:
      tags: [Actions dossier]
      operationId: transitionComplaint
      summary: Changer le statut (transition manuelle autorisée)
      description: |
        Seules les cibles de `allowed_transitions` sont acceptées (422 sinon). Les passages vers
        `reponse_envoyee` et `reouvert` passent par `/send-response` et `/reopen`.
      x-permissions: [complaints.transition]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_status, reason]
              properties:
                to_status: { $ref: '#/components/schemas/ComplaintStatus' }
                reason: { type: string, minLength: 3, maxLength: 2000 }
      responses:
        '200': { $ref: '#/components/responses/ComplaintDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyApi' }
  /complaints/{complaint}/assign:
    parameters:
      - $ref: '#/components/parameters/ComplaintId'
    post:
      tags: [Actions dossier]
      operationId: assignComplaint
      summary: Affecter / réattribuer le dossier
      x-permissions: [complaints.assign]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner_id, reason]
              properties:
                owner_id: { type: integer, description: Utilisateur propriétaire. }
                deputy_id: { type: [integer, 'null'], description: Suppléant (différent du propriétaire). }
                processing_entity_id: { type: [integer, 'null'], description: Entité de traitement active. }
                reason: { type: string, minLength: 3, maxLength: 2000 }
      responses:
        '200': { $ref: '#/components/responses/ComplaintDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyApi' }
  /complaints/{complaint}/acknowledge:
    parameters:
      - $ref: '#/components/parameters/ComplaintId'
    post:
      tags: [Actions dossier]
      operationId: acknowledgeComplaint
      summary: Enregistrer l'accusé de réception et sa preuve d'envoi
      x-permissions: ['complaints.create OU complaints.respond']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, delivery_status]
              properties:
                template_id: { type: [integer, 'null'], description: Modèle actif de type `accuse`. }
                channel: { type: string, description: Code de canal actif. }
                delivery_status: { $ref: '#/components/schemas/DeliveryStatus' }
      responses:
        '200': { $ref: '#/components/responses/ComplaintDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyApi' }
  /complaints/{complaint}/messages:
    parameters:
      - $ref: '#/components/parameters/ComplaintId'
    post:
      tags: [Actions dossier]
      operationId: addComplaintMessage
      summary: Ajouter un message client ou une note interne
      x-permissions:
        - 'client_message : complaints.respond'
        - 'internal_note : complaints.create OU complaints.respond OU quality.control'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, body]
              properties:
                kind: { $ref: '#/components/schemas/MessageKind' }
                body: { type: string, minLength: 1, maxLength: 5000 }
                channel: { type: [string, 'null'], description: Code de canal actif. }
      responses:
        '201': { $ref: '#/components/responses/ComplaintDetailCreated' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyApi' }
  /complaints/{complaint}/attachments:
    parameters:
      - $ref: '#/components/parameters/ComplaintId'
    post:
      tags: [Actions dossier]
      operationId: addComplaintAttachment
      summary: Joindre une pièce
      description: Seule une pièce classée `client` peut être `visibility=client`.
      x-permissions: ['complaints.create OU complaints.respond']
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, classification, visibility]
              properties:
                file: { type: string, format: binary, description: 'pdf, jpg, jpeg, png ; ≤ 10 Mo' }
                classification: { $ref: '#/components/schemas/AttachmentClassification' }
                visibility: { $ref: '#/components/schemas/Visibility' }
      responses:
        '201': { $ref: '#/components/responses/ComplaintDetailCreated' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyApi' }
  /complaints/{complaint}/tasks:
    parameters:
      - $ref: '#/components/parameters/ComplaintId'
    post:
      tags: [Tâches]
      operationId: createTask
      summary: Créer une tâche sur le dossier
      x-permissions: ['complaints.transition OU complaints.assign']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TaskInput'
                - required: [title]
      responses:
        '201':
          description: Tâche créée (statut `a_faire` par défaut).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyApi' }
  /complaints/{complaint}/solutions:
    parameters:
      - $ref: '#/components/parameters/ComplaintId'
    post:
      tags: [Solutions]
      operationId: proposeSolution
      summary: Proposer une solution (nouvelle version)
      x-permissions: [solutions.propose]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, description, decision]
              properties:
                type: { $ref: '#/components/schemas/SolutionType' }
                description: { type: string, minLength: 10, maxLength: 5000 }
                root_cause: { type: [string, 'null'], maxLength: 2000 }
                amount: { $ref: '#/components/schemas/AmountInput' }
                currency: { $ref: '#/components/schemas/CurrencyInput' }
                decision: { $ref: '#/components/schemas/Decision' }
      responses:
        '201':
          description: Solution créée (brouillon).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolutionEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyApi' }
  /complaints/{complaint}/send-response:
    parameters:
      - $ref: '#/components/parameters/ComplaintId'
    post:
      tags: [Actions dossier]
      operationId: sendComplaintResponse
      summary: Envoyer la réponse finale au client
      description: Exige une solution approuvée ; renseigne `final_response_at`, passe au statut `reponse_envoyee` et copie la décision.
      x-permissions: [complaints.respond]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body, channel]
              properties:
                body: { type: string, minLength: 10, maxLength: 10000 }
                template_id: { type: [integer, 'null'], description: Modèle actif. }
                channel: { type: string, description: Code de canal actif. }
      responses:
        '200': { $ref: '#/components/responses/ComplaintDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyApi' }
  /complaints/{complaint}/reopen:
    parameters:
      - $ref: '#/components/parameters/ComplaintId'
    post:
      tags: [Actions dossier]
      operationId: reopenComplaint
      summary: Réouvrir (crée un dossier enfant)
      description: La réponse contient le **dossier enfant** créé, avec `meta.tracking_code` et `meta.parent_reference`.
      x-permissions: [complaints.reopen]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 2000 }
      responses:
        '201':
          description: Dossier enfant créé.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ComplaintDetailEnvelope'
                  - type: object
                    required: [meta]
                    properties:
                      meta:
                        type: object
                        required: [tracking_code, parent_reference]
                        properties:
                          tracking_code: { type: string }
                          parent_reference: { $ref: '#/components/schemas/Reference' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyApi' }
  /complaints/{complaint}/mark-duplicate:
    parameters:
      - $ref: '#/components/parameters/ComplaintId'
    post:
      tags: [Actions dossier]
      operationId: markComplaintDuplicate
      summary: Marquer comme doublon (aucune suppression)
      description: L'utilisateur doit aussi pouvoir consulter le dossier original.
      x-permissions: [complaints.qualify]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [duplicate_of_id, reason]
              properties:
                duplicate_of_id: { type: integer }
                reason: { type: string, minLength: 3, maxLength: 2000 }
      responses:
        '200': { $ref: '#/components/responses/ComplaintDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyApi' }
  /complaints/{complaint}/controls:
    parameters:
      - $ref: '#/components/parameters/ComplaintId'
    post:
      tags: [Actions dossier]
      operationId: controlComplaint
      summary: Enregistrer un contrôle qualité
      x-permissions: [quality.control]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: { $ref: '#/components/schemas/ControlResult' }
                findings:
                  type: [string, 'null']
                  maxLength: 5000
                  description: Obligatoire sauf si `result = conforme`.
      responses:
        '201': { $ref: '#/components/responses/ComplaintDetailCreated' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyApi' }

  /attachments/{attachment}/download:
    get:
      tags: [Pièces jointes]
      operationId: downloadAttachment
      summary: Télécharger une pièce (contrôle d'accès, intégrité SHA-256, audit)
      description: |
        Interdit à la direction et pour une pièce rejetée à l'analyse. Pièce `confidentiel` :
        responsable, conformité, propriétaire ou suppléant du dossier uniquement.
      x-permissions: [complaints.view]
      parameters:
        - name: attachment
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Contenu binaire du fichier.
          headers:
            Content-Disposition:
              schema: { type: string }
              description: "attachment; filename=\"…\"; filename*=UTF-8''…"
          content:
            application/pdf:
              schema: { type: string, contentMediaType: application/pdf }
            image/jpeg:
              schema: { type: string, contentMediaType: image/jpeg }
            image/png:
              schema: { type: string, contentMediaType: image/png }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Intégrité du fichier non vérifiée (empreinte différente) — téléchargement refusé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyApi' }

  /tasks/{task}:
    patch:
      tags: [Tâches]
      operationId: updateTask
      summary: Mettre à jour une tâche
      description: Passage à `terminee` renseigne `completed_at` ; retour à un autre statut le remet à null.
      x-permissions: ['complaints.transition OU complaints.assign OU assigné de la tâche']
      parameters:
        - name: task
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskInput' }
      responses:
        '200':
          description: Tâche à jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyApi' }

  /solutions:
    get:
      tags: [Solutions]
      operationId: listSolutions
      summary: Solutions du périmètre (file d'approbation)
      x-permissions: ['solutions.propose OU solutions.approve_n1 OU solutions.approve_n2']
      parameters:
        - name: status
          in: query
          description: |
            Un statut (`SolutionStatus`) ou une liste séparée par des virgules (5 au plus),
            ex. `soumise,approuvee_n1`. Valeur inconnue → 422 « Statut de solution inconnu. ».
          schema:
            type: string
            pattern: '^(brouillon|soumise|approuvee_n1|approuvee|rejetee)(,(brouillon|soumise|approuvee_n1|approuvee|rejetee)){0,4}$'
            example: soumise,approuvee_n1
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Page de solutions (tri par mise à jour décroissante).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Solution' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyApi' }
  /solutions/{solution}/submit:
    post:
      tags: [Solutions]
      operationId: submitSolution
      summary: Soumettre une solution à validation
      x-permissions: [solutions.propose]
      parameters:
        - $ref: '#/components/parameters/SolutionId'
      responses:
        '200':
          description: Solution soumise.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolutionEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyApi' }
  /solutions/{solution}/approve:
    post:
      tags: [Solutions]
      operationId: approveSolution
      summary: Approuver ou rejeter (N1 responsable, N2 conformité)
      description: Le niveau N2 est requis si `requires_n2` (montant ≥ seuil `settings.n2_threshold`, 500 000 XAF par défaut).
      x-permissions: ['solutions.approve_n1 OU solutions.approve_n2']
      parameters:
        - $ref: '#/components/parameters/SolutionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { $ref: '#/components/schemas/ApprovalDecision' }
                comment:
                  type: [string, 'null']
                  maxLength: 2000
                  description: Obligatoire si `decision = rejete`.
      responses:
        '200':
          description: Décision enregistrée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolutionEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyApi' }

  /dashboard:
    get:
      tags: [Pilotage]
      operationId: dashboard
      summary: Tableau de bord (KPI, séries, priorités, activité)
      description: 'Période par défaut : 6 derniers mois (début du mois M-5 → `to` ou `as_of`).'
      x-permissions: [dashboard.view]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/AgencyId'
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/Status'
      responses:
        '200':
          description: Données du tableau de bord.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Dashboard' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyApi' }
  /deadlines:
    get:
      tags: [Pilotage]
      operationId: deadlines
      summary: Files d'échéance (paginées) + synthèse + règles actives
      description: |
        `a_echeance` (défaut) : dossiers ouverts non en retard, par échéance croissante ;
        `en_retard` : ouverts dont l'échéance finale est dépassée ; `clos_en_retard` : répondus après l'échéance.
        Les doublons sont exclus.
      x-permissions: [deadlines.view]
      parameters:
        - $ref: '#/components/parameters/Queue'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/AgencyId'
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/DeadlineFlagFilter'
        - $ref: '#/components/parameters/OwnerId'
        - $ref: '#/components/parameters/Mine'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
