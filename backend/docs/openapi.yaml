  /admin/imports:
    get:
      tags: [Admin — Imports]
      operationId: adminListImports
      summary: Lots d'import (paginé, plus récents d'abord)
      x-permissions: [admin.imports]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
