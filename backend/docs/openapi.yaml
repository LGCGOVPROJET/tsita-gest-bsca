  /admin/{type}:
    parameters:
      - $ref: '#/components/parameters/ReferentialType'
    get:
      tags: [Admin — Référentiels]
      operationId: adminListReferential
      summary: Lister un référentiel (non paginé, inactifs inclus)
      description: |
        Tri : `holidays` par date ; `templates` par type, code, version décroissante ; `agencies`/`entities` par nom ;
        sinon par libellé. Les éléments sont les modèles bruts (voir schémas `Agency`, `ProcessingEntity`,
        `Category`, `Product`, `ResponseTemplate`, `Holiday`).
      x-permissions: [admin.referentials]
      responses:
        '200':
          description: Éléments du référentiel.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ReferentialItem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyApi' }
    post:
      tags: [Admin — Référentiels]
      operationId: adminCreateReferential
      summary: Créer un élément de référentiel
      description: |
        Corps selon `type` (champs obligatoires à la création). `templates` : version = max(version du code)+1.
        `holidays` : pays forcé à `CG`, cache du calendrier vidé.
      x-permissions: [admin.referentials]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferentialInput' }
      responses:
        '201':
          description: Élément créé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferentialItemEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyApi' }
  /admin/{type}/{id}:
    parameters:
      - $ref: '#/components/parameters/ReferentialType'
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      tags: [Admin — Référentiels]
      operationId: adminUpdateReferential
      summary: Modifier un élément de référentiel
      description: |
        Champs facultatifs (`sometimes`). `templates` : toute modification de `subject`, `body` ou `kind` crée
        une **nouvelle version** (l'ancienne est désactivée) et la renvoie. `categories` : modification de
        `label`/`description` incrémente `version`.
      x-permissions: [admin.referentials]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferentialInput' }
      responses:
        '200':
          description: Élément à jour (ou nouvelle version de modèle).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferentialItemEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyApi' }
    delete:
      tags: [Admin — Référentiels]
      operationId: adminDeleteReferential
      summary: Désactiver (ou supprimer un jour férié)
      description: '`holidays` : suppression physique → 204. Autres types : désactivation (`is_active=false`) → 200 avec l''élément.'
      x-permissions: [admin.referentials]
      responses:
        '200':
          description: Élément désactivé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferentialItemEnvelope' }
        '204': { description: Jour férié supprimé. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyApi' }

  /admin/deadline-rules:
    get:
      tags: [Admin — Règles de délai]
      operationId: adminListDeadlineRules
      summary: Règles de délai versionnées (paginé)
      x-permissions: ['admin.rules OU admin.rules.validate']
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Règles paginées (tri type, code, version décroissante).
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DeadlineRule' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyApi' }
    post:
      tags: [Admin — Règles de délai]
      operationId: adminCreateDeadlineRule
      summary: Créer une règle (ou nouvelle version d'un code existant)
      description: Version = max(version du code)+1 ; statut `brouillon` par défaut ; point de départ `received_at`.
      x-permissions: [admin.rules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/DeadlineRuleInput'
                - required: [code, label, kind, unit, duration, source_type, source_reference, effective_from]
      responses:
        '201':
          description: Règle créée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeadlineRuleEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyApi' }
  /admin/deadline-rules/{rule}:
    parameters:
      - $ref: '#/components/parameters/RuleId'
    patch:
      tags: [Admin — Règles de délai]
      operationId: adminUpdateDeadlineRule
      summary: Modifier une règle non validée (ou retirer une règle validée)
      description: |
        Une règle `valide` est immuable : seul `{ "status": "retire" }` est accepté (permission `admin.rules`),
        sinon 422. Le `code` ne peut pas être modifié (422). La validation passe par `/validate`.
      x-permissions: [admin.rules]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeadlineRuleInput' }
      responses:
        '200':
          description: Règle à jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeadlineRuleEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Validation échouée, règle validée immuable ou changement de code.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'
        '429': { $ref: '#/components/responses/TooManyApi' }
    delete:
      tags: [Admin — Règles de délai]
      operationId: adminDeleteDeadlineRule
      summary: Suppression refusée (toujours 422)
      description: Les règles ne sont jamais supprimées ; utiliser le statut `retire`. Répond toujours 422 aux porteurs de `admin.rules`.
      x-permissions: [admin.rules]
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Suppression interdite.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyApi' }
  /admin/deadline-rules/{rule}/validate:
    post:
      tags: [Admin — Règles de délai]
      operationId: adminValidateDeadlineRule
      summary: Valider une règle (conformité)
      description: Uniquement une règle au statut `a_valider` (403 sinon). Renseigne `validated_by` et `validated_at`.
      x-permissions: [admin.rules.validate]
      parameters:
        - $ref: '#/components/parameters/RuleId'
      responses:
        '200':
          description: Règle validée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeadlineRuleEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyApi' }

