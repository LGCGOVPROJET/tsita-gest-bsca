              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ImportBatch' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyApi' }
    post:
      tags: [Admin — Imports]
      operationId: adminCreateImport
      summary: Importer un CSV historique (idempotent par SHA-256)
      description: Si le fichier a déjà été importé (même empreinte), 200 avec `meta.already_imported = true` et aucun dossier créé.
      x-permissions: [admin.imports]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, source_system]
              properties:
                file: { type: string, format: binary, description: 'CSV ou texte, ≤ 20 Mo' }
                source_system: { type: string, maxLength: 50, pattern: '^[A-Za-z0-9_-]+$' }
      responses:
        '200':
          description: Fichier déjà importé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '201':
          description: Import terminé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyApi' }
  /admin/imports/{import}:
    get:
      tags: [Admin — Imports]
      operationId: adminShowImport
      summary: Détail d'un lot avec ses anomalies
      x-permissions: [admin.imports]
      parameters:
        - name: import
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Lot et anomalies.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ImportBatchDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyApi' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: tsita-gest-session
      description: Cookie de session Laravel (httpOnly, SameSite=Lax), posé par `POST /auth/login`. Nom dérivé de APP_NAME (« TSITA GEST » → `tsita-gest-session`).
    xsrfToken:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Valeur du cookie `XSRF-TOKEN` obtenu via `GET /sanctum/csrf-cookie` ; requis sur les requêtes modifiantes.

  parameters:
    From:
      name: from
      in: query
      description: Début de période (jour local, inclus).
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      description: Fin de période (jour local, inclus) ; ≥ `from`.
      schema: { type: string, format: date }
    AsOf:
      name: as_of
      in: query
      description: Date de calcul (défaut aujourd'hui, Africa/Brazzaville).
      schema: { type: string, format: date }
    AgencyId:
      name: agency_id
      in: query
      description: Agence de réception.
      schema: { type: integer, minimum: 1 }
    EntityId:
      name: entity_id
      in: query
      description: Entité de traitement.
      schema: { type: integer, minimum: 1 }
    CategoryId:
      name: category_id
      in: query
      schema: { type: integer, minimum: 1 }
    ProductId:
      name: product_id
      in: query
      schema: { type: integer, minimum: 1 }
    Channel:
      name: channel
      in: query
      description: Code de canal existant (ex. `agence`, `email`, `portail`).
      schema: { type: string, maxLength: 30 }
    Status:
      name: status
      in: query
      schema: { $ref: '#/components/schemas/ComplaintStatus' }
    Search:
      name: search
      in: query
      description: Recherche sur la référence, l'objet ou le nom du client.
      schema: { type: string, maxLength: 100 }
    DeadlineFlagFilter:
      name: deadline_flag
      in: query
      schema: { $ref: '#/components/schemas/DeadlineFlag' }
    OwnerId:
      name: owner_id
      in: query
      schema: { type: integer, minimum: 1 }
    Mine:
      name: mine
      in: query
      description: '`1` = uniquement mes dossiers (propriétaire ou suppléant).'
      schema: { type: boolean }
    Sort:
      name: sort
      in: query
      description: Tri sur liste blanche ; préfixe `-` pour l'ordre décroissant.
      schema:
        type: string
        enum: [received_at, reference, status, due_at, priority, -received_at, -reference, -status, -due_at, -priority]
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Queue:
      name: queue
      in: query
      description: File d'échéance.
      schema:
        type: string
        enum: [a_echeance, en_retard, clos_en_retard]
        default: a_echeance
    ComplaintId:
      name: complaint
      in: path
      required: true
      description: Identifiant numérique du dossier.
      schema: { type: integer, minimum: 1 }
    SolutionId:
      name: solution
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    RuleId:
      name: rule
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ClientReference:
      name: reference
      in: path
      required: true
      description: Référence d'un dossier du client connecté.
      schema: { $ref: '#/components/schemas/Reference' }
    ReferentialType:
      name: type
      in: path
      required: true
      description: Type de référentiel administrable.
      schema:
        type: string
        enum: [agencies, entities, categories, products, templates, holidays]

  responses:
    Unauthenticated:
      description: Non authentifié, ou compte inactif/verrouillé (session invalidée).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Non authentifié. }
    Forbidden:
      description: Permission ou périmètre insuffisant (ou rôle non admis sur la zone client/staff).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Action non autorisée. }
    NotFound:
      description: Ressource introuvable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Ressource introuvable. }
    TrackNotFound:
      description: Référence inconnue ou code de suivi invalide (réponse indistincte).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Dossier introuvable ou code de suivi invalide. }
    ClientNotFound:
      description: Dossier inexistant ou n'appartenant pas au client connecté.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Dossier introuvable. }
    ValidationFailed:
      description: Données invalides ou règle métier non respectée.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    CsrfMismatch:
      description: Jeton CSRF absent ou expiré (appeler de nouveau `GET /sanctum/csrf-cookie`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyLogin:
      description: Trop de tentatives (5/min par email + IP).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Trop de tentatives de connexion. Réessayez dans une minute. }
    TooManyPublic:
      description: Trop de requêtes sur le portail public (10/min par IP).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Trop de requêtes. Réessayez dans une minute. }
    TooManyApi:
      description: Limite de l'API authentifiée atteinte (180/min par utilisateur).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ComplaintDetail:
      description: Dossier à jour.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ComplaintDetailEnvelope' }
    ComplaintDetailCreated:
      description: Élément ajouté ; dossier à jour.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ComplaintDetailEnvelope' }
    ExportFile:
      description: Fichier exporté (`Content-Disposition` attachment, nom `tsita-gest-<type>-AAAAMMJJ-HHMMSS.<ext>`).
      headers:
        Content-Disposition:
          schema: { type: string }
      content:
        text/csv:
          schema: { type: string, description: CSV UTF-8 avec BOM, séparateur `;`. }
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema: { type: string, contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet }
        application/pdf:
          schema: { type: string, contentMediaType: application/pdf }

  schemas:
    # ---------------------------------------------------------- Erreurs
    Error:
      type: object
      description: Erreur simple.
      required: [message]
      properties:
        message: { type: string }
    ValidationError:
      type: object
      description: Erreur de validation ou de règle métier (422). Clé `general` si l'erreur ne concerne pas un champ.
      required: [message, errors]
      properties:
        message: { type: string, example: Le champ reason est obligatoire. }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          example: { reason: [Le champ reason est obligatoire.] }
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }
    PaginationMeta:
      type: object
      description: Métadonnées de pagination.
      required: [current_page, last_page, per_page, total]
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    # ---------------------------------------------------------- Types de base
    DateTime:
      type: string
      format: date-time
      description: ISO 8601 avec décalage +01:00 (Africa/Brazzaville).
      example: '2026-04-14T09:30:00+01:00'
    NullableDateTime:
      type: [string, 'null']
      format: date-time
      description: ISO 8601 avec décalage +01:00, ou null.
      example: '2026-04-14T09:30:00+01:00'
    Reference:
      type: string
      pattern: '^TG-BSCA-\d{4}-\d{6}$'
      example: TG-BSCA-2026-000123
    Amount:
      type: [string, 'null']
      pattern: '^-?\d+\.\d{2}$'
      description: Montant décimal en chaîne (2 décimales) ou null. Toujours accompagné de `currency`.
      example: '150000.00'
    Currency:
      type: [string, 'null']
      enum: [XAF, EUR, USD, CNY, XOF, null]
      description: Devise ISO 4217 ou null.
    AmountInput:
      type: [number, string, 'null']
      minimum: 0
      maximum: 9999999999999.99
      description: Montant ≥ 0, au plus 2 décimales. Si fourni, `currency` est obligatoire.
    CurrencyInput:
      type: [string, 'null']
      enum: [XAF, EUR, USD, CNY, XOF, null]
      description: Obligatoire si `amount` est fourni.
    IdName:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    IdLabel:
      type: object
      required: [id, label]
      properties:
        id: { type: integer }
        label: { type: string }
    CodeLabel:
      type: object
      required: [code, label]
      properties:
        code: { type: string }
        label: { type: string }
    ValueLabel:
      type: object
      required: [value, label]
      properties:
        value: { type: string }
        label: { type: string }
    ReplyChannel:
      type: string
      enum: [courriel, courrier, telephone]
      description: Canal de réponse préféré du client. En entrée, l'alias rétrocompatible `email` est converti en `courriel`.

    # ---------------------------------------------------------- Énumérations
    ComplaintStatus:
      type: string
      description: |
        Statut interne. brouillon (Brouillon), recu (Reçu), a_qualifier (À qualifier), affecte (Affecté),
        en_investigation (En investigation), attente_information (Attente d'information),
        solution_proposee (Solution proposée), a_valider (À valider), reponse_envoyee (Réponse envoyée),
        cloture (Clôturé), reouvert (Réouvert).
      enum: [brouillon, recu, a_qualifier, affecte, en_investigation, attente_information, solution_proposee, a_valider, reponse_envoyee, cloture, reouvert]
    ClientStatus:
      type: string
      description: Statut simplifié affiché au client (jamais le statut interne).
      enum: [recue, en_cours, information_demandee, reponse_envoyee, cloturee, reouverte]
    Decision:
      type: string
      description: fondee, partiellement_fondee, non_fondee, irrecevable_motivee.
      enum: [fondee, partiellement_fondee, non_fondee, irrecevable_motivee]
    Priority:
      type: string
      enum: [basse, normale, haute, critique]
    RiskLevel:
      type: string
      enum: [faible, moyen, eleve]
    DeadlineFlag:
      type: string
      description: ok (Dans les délais), a_risque, en_retard, clos_en_retard, sans_regle (Règle à valider).
      enum: [ok, a_risque, en_retard, clos_en_retard, sans_regle]
    DeadlineKind:
      type: string
      enum: [accuse, reponse_finale, prealerte, controle]
    DeadlineStatus:
      type: string
      enum: [en_cours, respectee, depassee, respectee_en_retard]
    DeadlineUnit:
      type: string
      description: calendar (jours calendaires) ou business (jours ouvrés).
      enum: [calendar, business]
    DeliveryStatus:
      type: string
      enum: [en_attente, envoye, echec]
    MessageKind:
      type: string
      enum: [client_message, internal_note]
    MessageDirection:
      type: string
      enum: [entrant, sortant]
    AttachmentClassification:
      type: string
      enum: [client, interne, confidentiel]
    Visibility:
      type: string
      enum: [internal, client]
    ScanStatus:
      type: string
      enum: [en_attente, sain, rejete]
    EventType:
      type: string
      enum: [created, acknowledged, qualified, assigned, status_changed, message, attachment, solution, approval, response_sent, reopened, duplicate, escalated, deadline]
    SolutionType:
      type: string
      enum: [remboursement, correction_operation, explication_motivee, autre_mesure, non_fondement]
    SolutionStatus:
      type: string
      enum: [brouillon, soumise, approuvee_n1, approuvee, rejetee]
    ApprovalDecision:
      type: string
      enum: [approuve, rejete]
    ControlResult:
      type: string
      enum: [conforme, non_conforme, a_revoir]
    TaskStatus:
      type: string
      enum: [a_faire, en_cours, terminee]
    QualityActionStatus:
      type: string
      enum: [planifiee, en_cours, realisee, verifiee]
    RuleSourceType:
      type: string
      enum: [juridique, interne, demonstration]
    RuleStatus:
      type: string
      enum: [brouillon, a_valider, valide, retire]
    ImportStatus:
      type: string
      enum: [en_cours, termine, termine_avec_anomalies, echec]
    AnomalyResolution:
      type: string
      enum: [a_traiter, resolu, ignore]
    TemplateKind:
      type: string
      enum: [accuse, attente, reponse, cloture]
    ExportFormat:
      type: string
      enum: [csv, xlsx, pdf]
    Role:
      type: string
      enum: [client, agent_accueil, gestionnaire, responsable, qualite, conformite, direction, admin]
    Permission:
      type: string
      enum:
        - complaints.view
        - complaints.create
        - complaints.qualify
        - complaints.assign
        - complaints.transition
        - complaints.respond
        - complaints.reopen
        - complaints.export
        - solutions.propose
        - solutions.approve_n1
        - solutions.approve_n2
        - quality.manage
        - quality.control
        - reports.view
        - reports.validate
        - dashboard.view
        - deadlines.view
        - admin.users
        - admin.referentials
        - admin.rules
        - admin.rules.validate
        - admin.audit
        - admin.imports

    # ---------------------------------------------------------- Auth / utilisateurs
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 190 }
        password: { type: string, maxLength: 255, format: password }
        mfa_code: { type: [string, 'null'], pattern: '^\d{6}$', description: Code TOTP si la MFA est activée. }
    MfaRequired:
      type: object
      required: [mfa_required]
      properties:
        mfa_required: { type: boolean, const: true }
    User:
      type: object
      description: Utilisateur (UserResource).
      required: [id, name, email, role, role_label, agency, entity, mfa_enabled, permissions]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        role_label: { type: string, example: Gestionnaire }
        agency:
          oneOf:
            - $ref: '#/components/schemas/IdName'
            - type: 'null'
        entity:
          oneOf:
            - $ref: '#/components/schemas/IdName'
            - type: 'null'
        mfa_enabled: { type: boolean }
        mfa_required: { type: boolean, description: "La MFA est imposée à ce profil (MFA_ENFORCED_ROLES)." }
        mfa_enrollment_required:
          type: boolean
          description: "true = MFA imposée mais non configurée : seules /auth/me, /auth/mfa/setup, /auth/mfa/confirm et /auth/logout répondent ; toute autre route renvoie 403 {message, mfa_enrollment_required: true}."
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
    UserEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/User' }
    AdminUser:
      description: Utilisateur vu par l'administration (AdminUserResource).
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [phone, is_active, locked_until, last_login_at, customer_id, created_at]
          properties:
            phone: { type: [string, 'null'] }
            is_active: { type: boolean }
            locked_until: { $ref: '#/components/schemas/NullableDateTime' }
            last_login_at: { $ref: '#/components/schemas/NullableDateTime' }
            customer_id: { type: [integer, 'null'] }
            created_at: { $ref: '#/components/schemas/NullableDateTime' }
    AdminUserEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/AdminUser' }
    AdminUserInput:
      type: object
      description: Champs obligatoires à la création (name, email, password, role) ; facultatifs en modification.
      properties:
        name: { type: string, minLength: 2, maxLength: 150 }
        email: { type: string, format: email, maxLength: 190, description: Unique (normalisé en minuscules). }
        password: { type: string, minLength: 12, maxLength: 255, format: password, description: '≥ 12 caractères, majuscule, minuscule, chiffre, symbole.' }
        role: { $ref: '#/components/schemas/Role' }
        agency_id: { type: [integer, 'null'] }
        entity_id: { type: [integer, 'null'] }
        customer_id: { type: [integer, 'null'] }
        phone: { type: [string, 'null'], maxLength: 40 }
        is_active: { type: boolean }
        unlock: { type: boolean, description: Remet à zéro les échecs et le verrouillage. }
        reset_mfa: { type: boolean, description: Désactive la MFA et efface le secret. }

    # ---------------------------------------------------------- Public / client
    TrackRequest:
      type: object
      required: [reference, tracking_code]
      properties:
        reference:
          type: string
          maxLength: 25
          pattern: '^[Tt][Gg]-[Bb][Ss][Cc][Aa]-\d{4}-\d{6}$'
          description: Référence du dossier (insensible à la casse).
          example: TG-BSCA-2026-000123
        tracking_code: { type: string, minLength: 8, maxLength: 12 }
    PublicComplaintRequest:
      type: object
      required: [full_name, email, product_id, subject, description, preferred_channel, consent]
      properties:
        full_name: { type: string, minLength: 2, maxLength: 150 }
        email: { type: string, format: email, maxLength: 190 }
        phone: { type: [string, 'null'], maxLength: 40, pattern: '^[0-9+().\s-]{6,40}$' }
        customer_number: { type: [string, 'null'], maxLength: 40, pattern: '^[A-Za-z0-9-]+$' }
        product_id: { type: integer, description: Produit actif. }
        category_id: { type: [integer, 'null'], description: Catégorie active. }
        agency_id: { type: [integer, 'null'], description: Agence active. }
        subject: { type: string, minLength: 3, maxLength: 190 }
        description: { type: string, minLength: 10, maxLength: 5000 }
        operation_date: { type: [string, 'null'], format: date, description: '≤ aujourd''hui.' }
        amount: { $ref: '#/components/schemas/AmountInput' }
        currency: { $ref: '#/components/schemas/CurrencyInput' }
        preferred_channel: { $ref: '#/components/schemas/ReplyChannel' }
        consent: { type: boolean, description: 'Doit être accepté (true, 1, "yes", "on").' }
        attachments[]:
          type: array
          maxItems: 5
          items: { type: string, format: binary, description: 'pdf, jpg, jpeg, png ; ≤ 10 Mo' }
    PublicComplaintConfirmation:
      type: object
      description: Confirmation de dépôt (ComplaintIntakeService::confirmation). Le code de suivi n'est montré qu'une fois.
      required: [reference, tracking_code, received_at, acknowledgment_due_at, final_response_due_at, rule_is_demo]
      properties:
        reference: { $ref: '#/components/schemas/Reference' }
        tracking_code: { type: string, description: Code de suivi (8 caractères). }
        received_at: { $ref: '#/components/schemas/NullableDateTime' }
        acknowledgment_due_at: { $ref: '#/components/schemas/NullableDateTime' }
        final_response_due_at: { $ref: '#/components/schemas/NullableDateTime' }
        rule_is_demo: { type: boolean, description: Vrai si l'échéance est calculée avec une règle de démonstration non validée. }
    ReopenConfirmationEnvelope:
      type: object
      description: Confirmation d'un dossier enfant créé par réouverture (nouveau code de suivi).
      required: [data]
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/PublicComplaintConfirmation'
            - type: object
              required: [parent_reference]
              properties:
                parent_reference: { $ref: '#/components/schemas/Reference' }
    ClientComplaintSummary:
      type: object
      description: Vue client résumée (ClientViewPresenter::summary). Aucune donnée interne.
      required: [reference, subject, category_label, product_label, client_status, client_status_label, received_at, last_update_at, next_step, can_reopen]
      properties:
        reference: { $ref: '#/components/schemas/Reference' }
        subject: { type: string }
        category_label: { type: [string, 'null'] }
        product_label: { type: [string, 'null'] }
        client_status: { $ref: '#/components/schemas/ClientStatus' }
        client_status_label: { type: string, example: En cours d'analyse }
        received_at: { $ref: '#/components/schemas/NullableDateTime' }
        last_update_at: { $ref: '#/components/schemas/NullableDateTime' }
        next_step: { type: string, description: Prochaine étape rédigée pour le client. }
        can_reopen: { type: boolean }
    ClientComplaintView:
      description: |
        Vue client complète (ClientViewPresenter::present). N'expose jamais : notes internes, noms d'agents,
        avis de contrôle, pièces internes, statut interne, motifs internes des transitions.
      allOf:
        - $ref: '#/components/schemas/ClientComplaintSummary'
        - type: object
          required: [final_response, timeline, messages, documents]
          properties:
            final_response:
              oneOf:
                - type: object
                  required: [sent_at, body]
                  properties:
                    sent_at: { $ref: '#/components/schemas/NullableDateTime' }
                    body: { type: [string, 'null'] }
                - type: 'null'
            timeline:
              type: array
              description: Événements de visibilité client uniquement.
              items:
                type: object
                required: [date, title, description]
                properties:
                  date: { $ref: '#/components/schemas/NullableDateTime' }
                  title: { type: string }
                  description: { type: [string, 'null'] }
            messages:
              type: array
              description: Messages clients entrants ou envoyés avec succès.
              items:
                type: object
                required: [date, from, body]
                properties:
                  date: { $ref: '#/components/schemas/NullableDateTime' }
                  from: { type: string, enum: [client, bsca] }
                  body: { type: string }
            documents:
              type: array
              description: Pièces de visibilité client non rejetées.
              items:
                type: object
                required: [name, date, from]
                properties:
                  name: { type: string }
                  date: { $ref: '#/components/schemas/NullableDateTime' }
                  from: { type: string, enum: [client, bsca] }
    ClientComplaintViewEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ClientComplaintView' }

    # ---------------------------------------------------------- Référentiels
    InternalReferentials:
      type: object
      required: [agencies, entities, categories, products, channels, statuses, decisions, priorities, solution_types, templates, users]
      properties:
        agencies:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              code: { type: string }
              name: { type: string }
              city: { type: string }
              is_active: { type: boolean }
        entities:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              code: { type: string }
              name: { type: string }
              is_active: { type: boolean }
        categories:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              code: { type: string }
              label: { type: string }
              is_active: { type: boolean }
              version: { type: integer }
        products:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              code: { type: string }
              label: { type: string }
              is_active: { type: boolean }
        channels:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              code: { type: string }
              label: { type: string }
              is_active: { type: boolean }
        statuses:
          type: array
          items: { $ref: '#/components/schemas/ValueLabel' }
        decisions:
          type: array
          items: { $ref: '#/components/schemas/ValueLabel' }
        priorities:
          type: array
          items: { $ref: '#/components/schemas/ValueLabel' }
        solution_types:
          type: array
          items: { $ref: '#/components/schemas/ValueLabel' }
        templates:
          type: array
          description: Modèles de réponse actifs.
          items:
            type: object
            properties:
              id: { type: integer }
              code: { type: string }
              kind: { $ref: '#/components/schemas/TemplateKind' }
              label: { type: string }
              subject: { type: string }
              body: { type: string }
              version: { type: integer }
        users:
          type: array
          description: Collaborateurs actifs affectables (gestionnaire, responsable, agent_accueil, qualite, conformite).
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              role: { $ref: '#/components/schemas/Role' }
              entity_id: { type: [integer, 'null'] }

    CustomerSearchItem:
      type: object
      required: [id, full_name, email, phone, customer_number_masked, preferred_channel, complaints_count]
      properties:
        id: { type: integer }
        full_name: { type: string }
        email: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        customer_number_masked: { type: [string, 'null'], example: '••••••4821' }
        preferred_channel:
          oneOf:
            - $ref: '#/components/schemas/ReplyChannel'
            - type: 'null'
        complaints_count: { type: integer }

    # ---------------------------------------------------------- Réclamations
    StoreComplaintRequest:
      type: object
      description: Saisie agent. `full_name` obligatoire si `customer_id` est absent.
      required: [product_id, channel, subject, description]
      properties:
        customer_id: { type: [integer, 'null'], description: Rattachement à un client existant. }
        full_name: { type: [string, 'null'], minLength: 2, maxLength: 150 }
        email: { type: [string, 'null'], format: email, maxLength: 190 }
        phone: { type: [string, 'null'], maxLength: 40, pattern: '^[0-9+().\s-]{6,40}$' }
        customer_number: { type: [string, 'null'], maxLength: 40, pattern: '^[A-Za-z0-9-]+$' }
        product_id: { type: integer, description: Produit actif. }
        category_id: { type: [integer, 'null'] }
        agency_id: { type: [integer, 'null'] }
        receiving_agency_id: { type: [integer, 'null'], description: Agence de réception active. }
        channel: { type: string, description: Code de canal actif. }
        received_at: { type: [string, 'null'], format: date-time, description: Date effective de réception (≤ maintenant). }
        subject: { type: string, minLength: 3, maxLength: 190 }
        description: { type: string, minLength: 10, maxLength: 5000 }
        operation_date: { type: [string, 'null'], format: date }
        amount: { $ref: '#/components/schemas/AmountInput' }
        currency: { $ref: '#/components/schemas/CurrencyInput' }
        preferred_channel:
          oneOf:
            - $ref: '#/components/schemas/ReplyChannel'
            - type: 'null'
        consent: { type: [boolean, 'null'] }
        attachments[]:
          type: array
          maxItems: 5
          items: { type: string, format: binary, description: 'pdf, jpg, jpeg, png ; ≤ 10 Mo' }
    QualifyComplaintRequest:
      type: object
      description: Qualification (tous champs facultatifs sauf `reason`).
      required: [reason]
      properties:
        category_id: { type: [integer, 'null'] }
        product_id: { type: [integer, 'null'] }
        processing_entity_id: { type: [integer, 'null'] }
        priority: { $ref: '#/components/schemas/Priority' }
        risk_level: { $ref: '#/components/schemas/RiskLevel' }
        amount: { $ref: '#/components/schemas/AmountInput' }
        currency: { $ref: '#/components/schemas/CurrencyInput' }
        subject: { type: string, minLength: 3, maxLength: 190 }
        reason: { type: string, minLength: 3, maxLength: 2000, description: Motif (tracé dans l'audit). }
    ComplaintListItem:
      type: object
      description: Élément de liste (ComplaintListItemResource). `customer_name` masqué (« J. M*** ») pour la direction.
      required: [id, reference, subject, customer_name, channel, receiving_agency, processing_entity, category, status, status_label, decision, decision_label, priority, received_at, due_at, deadline_flag, deadline_flag_label, owner]
      properties:
        id: { type: integer }
        reference: { $ref: '#/components/schemas/Reference' }
        subject: { type: string }
        customer_name: { type: [string, 'null'] }
        channel:
          oneOf:
            - $ref: '#/components/schemas/CodeLabel'
            - type: 'null'
        receiving_agency:
          oneOf:
            - $ref: '#/components/schemas/IdName'
            - type: 'null'
        processing_entity:
          oneOf:
            - $ref: '#/components/schemas/IdName'
            - type: 'null'
        category:
          oneOf:
            - $ref: '#/components/schemas/IdLabel'
            - type: 'null'
        status: { $ref: '#/components/schemas/ComplaintStatus' }
        status_label: { type: string }
        decision:
          oneOf:
            - $ref: '#/components/schemas/Decision'
            - type: 'null'
        decision_label: { type: [string, 'null'] }
        priority: { $ref: '#/components/schemas/Priority' }
        received_at: { $ref: '#/components/schemas/NullableDateTime' }
        due_at:
          $ref: '#/components/schemas/NullableDateTime'
          description: Échéance de réponse finale.
        deadline_flag: { $ref: '#/components/schemas/DeadlineFlag' }
        deadline_flag_label: { type: string }
        owner:
          oneOf:
            - $ref: '#/components/schemas/IdName'
            - type: 'null'
    Approval:
      type: object
      description: Décision d'approbation d'une solution.
      required: [id, level, approver, decision, decision_label, comment, decided_at]
      properties:
        id: { type: integer }
        level: { type: integer, enum: [1, 2], description: '1 = responsable (N1), 2 = conformité (N2).' }
        approver:
          oneOf:
            - $ref: '#/components/schemas/IdName'
            - type: 'null'
        decision: { $ref: '#/components/schemas/ApprovalDecision' }
        decision_label: { type: string }
        comment: { type: [string, 'null'] }
        decided_at: { $ref: '#/components/schemas/NullableDateTime' }
    Solution:
      type: object
      description: Proposition de solution versionnée (SolutionResource).
      required: [id, version, complaint, type, type_label, description, root_cause, decision, decision_label, status, status_label, amount, currency, proposed_by, submitted_at, requires_n2, created_at, approvals]
      properties:
        id: { type: integer }
        version: { type: integer }
        complaint:
          description: Présent dans les listes et réponses d'action ; null dans `ComplaintDetail.solutions`.
          oneOf:
            - type: object
              required: [id, reference, subject]
              properties:
                id: { type: integer }
                reference: { $ref: '#/components/schemas/Reference' }
                subject: { type: string }
            - type: 'null'
        type: { $ref: '#/components/schemas/SolutionType' }
        type_label: { type: string }
        description: { type: string }
        root_cause: { type: [string, 'null'] }
        decision: { $ref: '#/components/schemas/Decision' }
        decision_label: { type: string }
        status: { $ref: '#/components/schemas/SolutionStatus' }
        status_label: { type: string }
        amount: { $ref: '#/components/schemas/Amount' }
        currency: { $ref: '#/components/schemas/Currency' }
        proposed_by:
          oneOf:
            - $ref: '#/components/schemas/IdName'
            - type: 'null'
        submitted_at: { $ref: '#/components/schemas/NullableDateTime' }
        requires_n2: { type: boolean, description: Approbation N2 (conformité) requise (montant ≥ seuil). }
        created_at: { $ref: '#/components/schemas/NullableDateTime' }
        approvals:
          type: array
          items: { $ref: '#/components/schemas/Approval' }
    SolutionEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Solution' }
    Task:
      type: object
      description: Tâche de traitement (TaskResource).
      required: [id, complaint_id, title, description, assignee, due_at, status, status_label, completed_at, created_at]
      properties:
        id: { type: integer }
        complaint_id: { type: integer }
        title: { type: string }
        description: { type: [string, 'null'] }
        assignee:
          oneOf:
            - $ref: '#/components/schemas/IdName'
            - type: 'null'
        due_at: { $ref: '#/components/schemas/NullableDateTime' }
        status: { $ref: '#/components/schemas/TaskStatus' }
        status_label: { type: string }
        completed_at: { $ref: '#/components/schemas/NullableDateTime' }
        created_at: { $ref: '#/components/schemas/NullableDateTime' }
    TaskEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Task' }
    TaskInput:
      type: object
      properties:
        title: { type: string, minLength: 3, maxLength: 190 }
        description: { type: [string, 'null'], maxLength: 2000 }
        assignee_id: { type: [integer, 'null'] }
        due_at: { type: [string, 'null'], format: date-time, description: Date ou date-heure. }
        status: { $ref: '#/components/schemas/TaskStatus' }
    ComplaintDeadline:
      type: object
      required: [id, kind, kind_label, unit, due_at, initial_due_at, announced_at, met_at, status, status_label, rule]
      properties:
        id: { type: integer }
        kind: { $ref: '#/components/schemas/DeadlineKind' }
        kind_label: { type: string }
        unit: { $ref: '#/components/schemas/DeadlineUnit' }
        due_at: { $ref: '#/components/schemas/NullableDateTime' }
        initial_due_at: { $ref: '#/components/schemas/NullableDateTime' }
        announced_at: { $ref: '#/components/schemas/NullableDateTime' }
        met_at: { $ref: '#/components/schemas/NullableDateTime' }
        status: { $ref: '#/components/schemas/DeadlineStatus' }
        status_label: { type: string }
        rule:
          oneOf:
            - type: object
              required: [id, code, label, version, is_demo, source_type]
              properties:
                id: { type: integer }
                code: { type: string }
                label: { type: string }
                version: { type: [integer, 'null'] }
                is_demo: { type: boolean }
                source_type: { $ref: '#/components/schemas/RuleSourceType' }
            - type: 'null'
    TimelineEvent:
      type: object
      required: [id, date, type, type_label, title, description, visibility, actor, reason, from_status, to_status]
      properties:
        id: { type: integer }
        date: { $ref: '#/components/schemas/NullableDateTime' }
        type: { $ref: '#/components/schemas/EventType' }
        type_label: { type: string }
        title: { type: string }
        description: { type: [string, 'null'] }
        visibility: { $ref: '#/components/schemas/Visibility' }
        actor:
          oneOf:
            - $ref: '#/components/schemas/IdName'
            - type: 'null'
        reason: { type: [string, 'null'] }
        from_status:
          oneOf:
            - $ref: '#/components/schemas/ComplaintStatus'
            - type: 'null'
        to_status:
          oneOf:
            - $ref: '#/components/schemas/ComplaintStatus'
            - type: 'null'
    AttachmentItem:
      type: object
      required: [id, name, mime, size, sha256, classification, classification_label, visibility, scan_status, uploaded_by_client, uploaded_by, date, can_download, download_url]
      properties:
        id: { type: integer }
        name: { type: string }
        mime: { type: string }
        size: { type: integer, description: Taille en octets. }
        sha256: { type: string }
        classification: { $ref: '#/components/schemas/AttachmentClassification' }
        classification_label: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
        scan_status: { $ref: '#/components/schemas/ScanStatus' }
        uploaded_by_client: { type: boolean }
        uploaded_by:
          oneOf:
            - $ref: '#/components/schemas/IdName'
            - type: 'null'
        date: { $ref: '#/components/schemas/NullableDateTime' }
        can_download: { type: boolean }
        download_url: { type: string, example: /api/v1/attachments/12/download }
    MessageItem:
      type: object
      required: [id, kind, kind_label, direction, channel, author, author_is_client, subject, body, delivery_status, delivery_status_label, sent_at, date]
      properties:
        id: { type: integer }
        kind: { $ref: '#/components/schemas/MessageKind' }
        kind_label: { type: string }
        direction:
          oneOf:
            - $ref: '#/components/schemas/MessageDirection'
            - type: 'null'
        channel:
          oneOf:
            - $ref: '#/components/schemas/CodeLabel'
            - type: 'null'
        author:
          oneOf:
            - $ref: '#/components/schemas/IdName'
            - type: 'null'
        author_is_client: { type: boolean }
        subject: { type: [string, 'null'] }
        body: { type: string }
        delivery_status:
          oneOf:
            - $ref: '#/components/schemas/DeliveryStatus'
            - type: 'null'
        delivery_status_label: { type: [string, 'null'] }
        sent_at: { $ref: '#/components/schemas/NullableDateTime' }
        date: { $ref: '#/components/schemas/NullableDateTime' }
    ControlItem:
      type: object
      required: [id, result, result_label, findings, controller, controlled_at]
      properties:
        id: { type: integer }
        result: { $ref: '#/components/schemas/ControlResult' }
        result_label: { type: string }
        findings: { type: [string, 'null'] }
        controller:
          oneOf:
            - $ref: '#/components/schemas/IdName'
            - type: 'null'
        controlled_at: { $ref: '#/components/schemas/NullableDateTime' }
    ComplaintAuditItem:
      type: object
      required: [id, date, action, user, reason, before, after]
      properties:
        id: { type: integer }
        date: { $ref: '#/components/schemas/NullableDateTime' }
        action: { type: string }
        user:
          oneOf:
            - $ref: '#/components/schemas/IdName'
            - type: 'null'
        reason: { type: [string, 'null'] }
        before: { type: [object, 'null'], additionalProperties: true }
        after: { type: [object, 'null'], additionalProperties: true }
    ComplaintDetail:
      description: |
        Détail d'un dossier (ComplaintDetailResource) = ComplaintListItem + champs de détail.
        Pour un utilisateur sans accès aux données sensibles (direction) : `customer.full_name` masqué,
        `email`/`phone` null, `attachments`, `messages` et `audit` vides.
      allOf:
        - $ref: '#/components/schemas/ComplaintListItem'
        - type: object
          required: [description, customer, product, amount, currency, amount_flagged, risk_level, operation_date, acknowledged_at, acknowledgment_status, final_response_at, closed_at, mediation_requested_at, deputy, parent, children, duplicate_of, source, next_action, deadlines, timeline, attachments, messages, tasks, solutions, controls, audit, allowed_transitions, can]
          properties:
            description: { type: string }
            customer:
              oneOf:
                - type: object
                  required: [id, full_name, email, phone]
                  properties:
                    id: { type: integer }
                    full_name: { type: [string, 'null'] }
                    email: { type: [string, 'null'] }
                    phone: { type: [string, 'null'] }
                - type: 'null'
            product:
              oneOf:
                - $ref: '#/components/schemas/IdLabel'
                - type: 'null'
            amount: { $ref: '#/components/schemas/Amount' }
            currency: { $ref: '#/components/schemas/Currency' }
            amount_flagged: { type: boolean, description: Montant signalé (seuil ou incohérence). }
            risk_level: { $ref: '#/components/schemas/RiskLevel' }
            operation_date: { type: [string, 'null'], format: date }
            acknowledged_at: { $ref: '#/components/schemas/NullableDateTime' }
            acknowledgment_status: { $ref: '#/components/schemas/DeliveryStatus' }
            final_response_at: { $ref: '#/components/schemas/NullableDateTime' }
            closed_at: { $ref: '#/components/schemas/NullableDateTime' }
            mediation_requested_at: { $ref: '#/components/schemas/NullableDateTime' }
            deputy:
              oneOf:
                - $ref: '#/components/schemas/IdName'
                - type: 'null'
            parent:
              oneOf:
                - type: object
                  required: [id, reference]
                  properties:
                    id: { type: integer }
                    reference: { $ref: '#/components/schemas/Reference' }
                - type: 'null'
            children:
              type: array
              items:
                type: object
                required: [id, reference, status, status_label]
                properties:
                  id: { type: integer }
                  reference: { $ref: '#/components/schemas/Reference' }
                  status: { $ref: '#/components/schemas/ComplaintStatus' }
                  status_label: { type: string }
            duplicate_of:
              oneOf:
                - type: object
                  required: [id, reference]
                  properties:
                    id: { type: integer }
                    reference: { $ref: '#/components/schemas/Reference' }
                - type: 'null'
            source:
              description: Origine d'un dossier importé.
              oneOf:
                - type: object
                  required: [system, id, status_label]
                  properties:
                    system: { type: string }
                    id: { type: [string, 'null'] }
                    status_label: { type: [string, 'null'] }
                - type: 'null'
            next_action: { type: string, description: Prochaine action calculée (texte). }
            deadlines:
              type: array
              items: { $ref: '#/components/schemas/ComplaintDeadline' }
            timeline:
              type: array
              description: Événements internes et client, du plus récent au plus ancien.
              items: { $ref: '#/components/schemas/TimelineEvent' }
            attachments:
              type: array
              items: { $ref: '#/components/schemas/AttachmentItem' }
            messages:
              type: array
              description: Messages clients et notes internes, ordre chronologique.
              items: { $ref: '#/components/schemas/MessageItem' }
            tasks:
              type: array
              items: { $ref: '#/components/schemas/Task' }
            solutions:
              type: array
              description: Versions de solution (plus récente d'abord) ; `complaint` y vaut null.
              items: { $ref: '#/components/schemas/Solution' }
            controls:
              type: array
              items: { $ref: '#/components/schemas/ControlItem' }
            audit:
              type: array
              description: 50 dernières entrées d'audit du dossier.
              items: { $ref: '#/components/schemas/ComplaintAuditItem' }
            allowed_transitions:
              type: array
              description: Transitions manuelles possibles pour l'utilisateur (vide sans `complaints.transition`).
              items: { $ref: '#/components/schemas/ValueLabel' }
            can:
              type: object
              description: Actions permises à l'utilisateur courant sur ce dossier.
              required: [qualify, assign, transition, respond, acknowledge, note, attach, reopen, propose, approve, mark_duplicate, control, manage_tasks]
              properties:
                qualify: { type: boolean }
                assign: { type: boolean }
                transition: { type: boolean }
                respond: { type: boolean }
                acknowledge: { type: boolean }
                note: { type: boolean }
                attach: { type: boolean }
                reopen: { type: boolean }
                propose: { type: boolean }
                approve: { type: boolean }
                mark_duplicate: { type: boolean }
                control: { type: boolean }
                manage_tasks: { type: boolean }
    ComplaintDetailEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ComplaintDetail' }

    # ---------------------------------------------------------- Pilotage
    TreatmentRate:
      type: object
      description: Taux de traitement = cohorte traitée ÷ reçues (en %, 1 décimale ; null si dénominateur nul).
      required: [numerator, denominator, value]
      properties:
        numerator: { type: integer }
        denominator: { type: integer }
        value: { type: [number, 'null'], example: 87.5 }
    Kpis:
      type: object
      description: Indicateurs (références uniques, hors brouillons et doublons, périmètre de l'utilisateur).
      required: [received, responded, stock, at_risk, cohort_treated, late_open, late_closed, treatment_rate]
      properties:
        received: { type: integer, description: Reçues dans la période. }
        responded: { type: integer, description: Réponses finales dans la période. }
        stock: { type: integer, description: Sans réponse finale à la date de calcul. }
        at_risk: { type: integer, description: Ouverts non en retard, pré-alerte atteinte ou accusé à échéance. }
        cohort_treated: { type: integer, description: Reçues dans la période et répondues au plus tard à la date de calcul. }
        late_open: { type: integer, description: Ouverts dont l'échéance finale est dépassée. }
        late_closed: { type: integer, description: Répondus dans la période après l'échéance. }
        treatment_rate: { $ref: '#/components/schemas/TreatmentRate' }
    KpiMeta:
      type: object
      description: Contexte de calcul des indicateurs.
      required: [from, to, as_of, timezone, filters, definitions, rule_is_demo, rule_version, computed_at]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        as_of: { type: string, format: date }
        timezone: { type: string, example: Africa/Brazzaville }
        filters:
          description: Filtres de dimension actifs (agency_id, entity_id, category_id, product_id, channel, status). Tableau vide `[]` si aucun.
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              maxItems: 0
        definitions:
          type: object
          description: Définition textuelle de chaque indicateur (clé → texte).
          additionalProperties: { type: string }
        rule_is_demo: { type: boolean }
        rule_version: { type: [string, 'null'], description: Libellé de version de la règle de réponse finale applicable. }
        computed_at: { $ref: '#/components/schemas/DateTime' }
    Dashboard:
      type: object
      required: [kpis, monthly, by_category, by_channel, priorities, recent_events, meta]
      properties:
        kpis: { $ref: '#/components/schemas/Kpis' }
        monthly:
          type: array
          items:
            type: object
            required: [month, label, received, responded]
            properties:
              month: { type: string, pattern: '^\d{4}-\d{2}$', example: 2026-04 }
              label: { type: string, example: Avr }
              received: { type: integer }
              responded: { type: integer }
        by_category:
          type: array
          items:
            type: object
            required: [label, count]
            properties:
              label: { type: string }
              count: { type: integer }
        by_channel:
          type: array
          items:
            type: object
            required: [label, count]
            properties:
              label: { type: string }
              count: { type: integer }
        priorities:
          type: array
          maxItems: 5
          description: Dossiers ouverts prioritaires (en retard puis par échéance).
          items: { $ref: '#/components/schemas/ComplaintListItem' }
        recent_events:
          type: array
          maxItems: 10
          items:
            type: object
            required: [date, reference, complaint_id, title, actor]
            properties:
              date: { $ref: '#/components/schemas/NullableDateTime' }
              reference: { type: [string, 'null'] }
              complaint_id: { type: integer }
              title: { type: string }
              actor: { type: [string, 'null'], description: Nom de l'acteur. }
        meta: { $ref: '#/components/schemas/KpiMeta' }
    DeadlineQueueItem:
      description: Élément de file d'échéance = ComplaintListItem + dates d'échéance.
      allOf:
        - $ref: '#/components/schemas/ComplaintListItem'
        - type: object
          required: [prealert_at, acknowledgment_due_at, initial_due_at, announced_at, days_remaining, final_response_at]
          properties:
            prealert_at: { $ref: '#/components/schemas/NullableDateTime' }
            acknowledgment_due_at: { $ref: '#/components/schemas/NullableDateTime' }
            initial_due_at: { $ref: '#/components/schemas/NullableDateTime' }
            announced_at: { $ref: '#/components/schemas/NullableDateTime' }
            days_remaining: { type: [integer, 'null'], description: Jours restants (négatif si dépassé) ; null si répondu. }
            final_response_at: { $ref: '#/components/schemas/NullableDateTime' }
    DeadlinesPage:
      type: object
      required: [data, meta, summary, rules, rule_is_demo]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/DeadlineQueueItem' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
        summary:
          type: object
          required: [a_risque, en_retard, clos_en_retard]
          properties:
            a_risque: { type: integer }
            en_retard: { type: integer }
            clos_en_retard: { type: integer }
        rules:
          type: array
          description: Règles de délai actives.
          items: { $ref: '#/components/schemas/DeadlineRule' }
        rule_is_demo: { type: boolean }
    FlowRow:
      type: object
      required: [id, label, inflow, outflow, closing_stock]
      properties:
        id: { type: [integer, 'null'] }
        label: { type: string }
        inflow: { type: integer }
        outflow: { type: integer }
        closing_stock: { type: integer }
    Reconciliation:
      type: object
      required: [opening_stock, inflow, outflow, adjustments, closing_stock, balanced]
      properties:
        opening_stock: { type: integer, description: Stock à la veille de `from`. }
        inflow: { type: integer }
        outflow: { type: integer }
        adjustments: { type: integer, description: Ajustements justifiés (0 à ce jour). }
        closing_stock: { type: integer }
        balanced: { type: boolean }
    ActivityReport:
      description: Rapport d'activité et rapprochement du stock (ReportService::activity).
      allOf:
        - $ref: '#/components/schemas/Reconciliation'
        - type: object
          required: [by_month, by_agency, by_entity, by_channel, by_category, by_decision, late_open, late_closed, meta, validated_by, validated_at, validation]
          properties:
            validated_by:
              description: Validateur de la dernière validation correspondant à la période et aux filtres.
              oneOf:
                - $ref: '#/components/schemas/IdName'
                - type: 'null'
            validated_at: { $ref: '#/components/schemas/NullableDateTime' }
            validation:
              oneOf:
                - type: object
                  required: [id, comment, rule_version, as_of, snapshot]
                  properties:
                    id: { type: integer }
                    comment: { type: [string, 'null'] }
                    rule_version: { type: [string, 'null'] }
                    as_of: { type: [string, 'null'], format: date }
                    snapshot: { $ref: '#/components/schemas/Reconciliation' }
                - type: 'null'
            by_month:
              type: array
              items:
                allOf:
                  - type: object
                    required: [month, from, to]
                    properties:
                      month: { type: string, example: 2026-04 }
                      from: { type: string, format: date }
                      to: { type: string, format: date }
                  - $ref: '#/components/schemas/Reconciliation'
            by_agency:
              type: array
              items: { $ref: '#/components/schemas/FlowRow' }
            by_entity:
              type: array
              items: { $ref: '#/components/schemas/FlowRow' }
            by_channel:
              type: array
              items: { $ref: '#/components/schemas/FlowRow' }
            by_category:
              type: array
              items: { $ref: '#/components/schemas/FlowRow' }
            by_decision:
              type: array
              items:
                type: object
                required: [decision, label, count]
                properties:
                  decision:
                    oneOf:
                      - $ref: '#/components/schemas/Decision'
                      - type: 'null'
                  label: { type: string }
                  count: { type: integer }
            late_open: { type: integer }
            late_closed: { type: integer }
            meta:
              allOf:
                - $ref: '#/components/schemas/KpiMeta'
                - type: object
                  required: [formula]
                  properties:
                    formula: { type: string }

    ReportValidation:
      type: object
      description: Validation d'un rapport d'activité (instantané du rapprochement).
      required: [id, type, from, to, as_of, filters, rule_version, snapshot, comment, validated_by, validated_at]
      properties:
        id: { type: integer }
        type: { type: string, const: activity }
        from: { type: string, format: date }
        to: { type: string, format: date }
        as_of: { type: string, format: date }
        filters:
          description: Filtres de dimension non vides (objet, ou `[]` si aucun).
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              maxItems: 0
        rule_version: { type: [string, 'null'] }
        snapshot: { $ref: '#/components/schemas/Reconciliation' }
        comment: { type: [string, 'null'] }
        validated_by: { $ref: '#/components/schemas/IdName' }
        validated_at: { $ref: '#/components/schemas/NullableDateTime' }

    # ---------------------------------------------------------- Qualité
    QualityAction:
      type: object
      description: Action du plan qualité (QualityActionResource).
      required: [id, title, root_cause, category, owner, owner_entity, due_at, status, status_label, effectiveness_measure, evidence, completed_at, complaints, complaints_count, created_at]
      properties:
        id: { type: integer }
        title: { type: string }
        root_cause: { type: string }
        category:
          oneOf:
            - $ref: '#/components/schemas/IdLabel'
            - type: 'null'
        owner:
          oneOf:
            - $ref: '#/components/schemas/IdName'
            - type: 'null'
        owner_entity:
          oneOf:
            - $ref: '#/components/schemas/IdName'
            - type: 'null'
        due_at: { $ref: '#/components/schemas/NullableDateTime' }
        status: { $ref: '#/components/schemas/QualityActionStatus' }
        status_label: { type: string }
        effectiveness_measure: { type: [string, 'null'] }
        evidence: { type: [string, 'null'] }
        completed_at: { $ref: '#/components/schemas/NullableDateTime' }
        complaints:
          type: array
          items:
            type: object
            required: [id, reference]
            properties:
              id: { type: integer }
              reference: { $ref: '#/components/schemas/Reference' }
        complaints_count: { type: integer }
        created_at: { $ref: '#/components/schemas/NullableDateTime' }
    QualityActionEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/QualityAction' }
    QualityActionInput:
      type: object
      description: '`title` et `root_cause` obligatoires à la création.'
      properties:
        title: { type: string, minLength: 3, maxLength: 190 }
        root_cause: { type: string, minLength: 3, maxLength: 5000 }
        category_id: { type: [integer, 'null'] }
        owner_id: { type: [integer, 'null'] }
        owner_entity_id: { type: [integer, 'null'] }
        due_at: { type: [string, 'null'], format: date-time, description: Date ou date-heure. }
        status: { $ref: '#/components/schemas/QualityActionStatus' }
        effectiveness_measure: { type: [string, 'null'], maxLength: 5000 }
        evidence: { type: [string, 'null'], maxLength: 5000 }
        complaint_ids:
          type: array
          maxItems: 200
          items: { type: integer }
    RecurringGroup:
      type: object
      required: [category, category_id, product, product_id, count, late_count, reopened_count]
      properties:
        category: { type: string, description: '« Non qualifiée » si absente.' }
        category_id: { type: [integer, 'null'] }
        product: { type: string, description: '« Non renseigné » si absent.' }
        product_id: { type: [integer, 'null'] }
        count: { type: integer }
        late_count: { type: integer }
        reopened_count: { type: integer }

    # ---------------------------------------------------------- Admin
    DeadlineRule:
      type: object
      description: Règle de délai versionnée (DeadlineRuleResource). Une règle validée est immuable.
      required: [id, code, label, kind, kind_label, unit, unit_label, duration, start_point, source_type, source_type_label, source_reference, effective_from, effective_to, version, status, status_label, is_demo, validated_by, validated_at, notes]
      properties:
        id: { type: integer }
        code: { type: string, example: REP_FINALE }
        label: { type: string }
        kind: { $ref: '#/components/schemas/DeadlineKind' }
        kind_label: { type: string }
        unit: { $ref: '#/components/schemas/DeadlineUnit' }
        unit_label: { type: string }
        duration: { type: integer, minimum: 0, maximum: 365 }
        start_point: { type: string, example: received_at }
        source_type: { $ref: '#/components/schemas/RuleSourceType' }
        source_type_label: { type: string }
        source_reference: { type: string }
        effective_from: { type: [string, 'null'], format: date }
        effective_to: { type: [string, 'null'], format: date }
        version: { type: integer }
        status: { $ref: '#/components/schemas/RuleStatus' }
        status_label: { type: string }
        is_demo: { type: boolean }
        validated_by:
          oneOf:
            - $ref: '#/components/schemas/IdName'
            - type: 'null'
        validated_at: { $ref: '#/components/schemas/NullableDateTime' }
        notes: { type: [string, 'null'] }
    DeadlineRuleEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/DeadlineRule' }
    DeadlineRuleInput:
      type: object
      description: 'Obligatoires à la création : code, label, kind, unit, duration, source_type, source_reference, effective_from.'
      properties:
        code: { type: string, maxLength: 40, pattern: '^[A-Z0-9_-]+$' }
        label: { type: string, maxLength: 190 }
        kind: { $ref: '#/components/schemas/DeadlineKind' }
        unit: { $ref: '#/components/schemas/DeadlineUnit' }
        duration: { type: integer, minimum: 0, maximum: 365 }
        source_type: { $ref: '#/components/schemas/RuleSourceType' }
        source_reference: { type: string, maxLength: 255 }
        effective_from: { type: string, format: date }
        effective_to: { type: [string, 'null'], format: date, description: '≥ effective_from.' }
        status:
          type: string
          enum: [brouillon, a_valider, retire]
          description: '`valide` uniquement via POST /admin/deadline-rules/{rule}/validate.'
        notes: { type: [string, 'null'], maxLength: 2000 }
    AuditLogEntry:
      type: object
      required: [id, date, user, action, auditable_type, auditable_id, before, after, reason, ip, user_agent]
      properties:
        id: { type: integer }
        date: { $ref: '#/components/schemas/NullableDateTime' }
        user:
          oneOf:
            - type: object
              required: [id, name, email]
              properties:
                id: { type: integer }
                name: { type: string }
                email: { type: string }
            - type: 'null'
        action: { type: string, example: complaint.view }
        auditable_type: { type: [string, 'null'], example: Complaint }
        auditable_id: { type: [integer, 'null'] }
        before: { type: [object, 'null'], additionalProperties: true }
        after: { type: [object, 'null'], additionalProperties: true }
        reason: { type: [string, 'null'] }
        ip: { type: [string, 'null'] }
        user_agent: { type: [string, 'null'] }
    ImportBatch:
      type: object
      description: Lot d'import CSV historique (ImportBatchResource).
      required: [id, filename, file_sha256, source_system, status, status_label, rows_total, rows_created, rows_skipped, rows_anomalies, report, imported_by, created_at]
      properties:
        id: { type: integer }
        filename: { type: string }
        file_sha256: { type: string }
        source_system: { type: string }
        status: { $ref: '#/components/schemas/ImportStatus' }
        status_label: { type: string }
        rows_total: { type: integer }
        rows_created: { type: integer }
        rows_skipped: { type: integer }
        rows_anomalies: { type: integer }
        report: { description: Rapport libre (JSON ou texte selon le stockage). }
        imported_by:
          oneOf:
            - $ref: '#/components/schemas/IdName'
            - type: 'null'
        created_at: { $ref: '#/components/schemas/NullableDateTime' }
    ImportBatchDetail:
      allOf:
        - $ref: '#/components/schemas/ImportBatch'
        - type: object
          required: [anomalies]
          properties:
            anomalies:
              type: array
              items:
                type: object
                required: [id, row_number, source_id, issue, raw, resolution_status, resolution_status_label, resolved_at]
                properties:
                  id: { type: integer }
                  row_number: { type: integer }
                  source_id: { type: [string, 'null'] }
                  issue: { type: string }
                  raw: { description: Ligne brute du CSV. }
                  resolution_status: { $ref: '#/components/schemas/AnomalyResolution' }
                  resolution_status_label: { type: string }
                  resolved_at: { $ref: '#/components/schemas/NullableDateTime' }
    ImportResult:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/ImportBatchDetail' }
        meta:
          type: object
          required: [already_imported, message]
          properties:
            already_imported: { type: boolean }
            message: { type: string }

    # ---------------------------------------------------------- Référentiels administrables
    Timestamps:
      type: object
      properties:
        created_at: { $ref: '#/components/schemas/NullableDateTime' }
        updated_at: { $ref: '#/components/schemas/NullableDateTime' }
    Agency:
      allOf:
        - $ref: '#/components/schemas/Timestamps'
        - type: object
          required: [id, code, name, city, is_active]
          properties:
            id: { type: integer }
            code: { type: string }
            name: { type: string }
            city: { type: string }
            is_active: { type: boolean }
    ProcessingEntity:
      allOf:
        - $ref: '#/components/schemas/Timestamps'
        - type: object
          required: [id, code, name, is_active]
          properties:
            id: { type: integer }
            code: { type: string }
            name: { type: string }
            is_active: { type: boolean }
    Category:
      allOf:
        - $ref: '#/components/schemas/Timestamps'
        - type: object
          required: [id, code, label, is_active, version]
          properties:
            id: { type: integer }
            code: { type: string }
            label: { type: string }
            description: { type: [string, 'null'] }
            is_active: { type: boolean }
            version: { type: integer }
    Product:
      allOf:
        - $ref: '#/components/schemas/Timestamps'
        - type: object
          required: [id, code, label, is_active]
          properties:
            id: { type: integer }
            code: { type: string }
            label: { type: string }
            is_active: { type: boolean }
    ResponseTemplate:
      allOf:
        - $ref: '#/components/schemas/Timestamps'
        - type: object
          required: [id, code, kind, label, subject, body, version, is_active]
          properties:
            id: { type: integer }
            code: { type: string }
            kind: { $ref: '#/components/schemas/TemplateKind' }
            label: { type: string }
            subject: { type: string }
            body: { type: string }
            version: { type: integer }
            is_active: { type: boolean }
    Holiday:
      allOf:
        - $ref: '#/components/schemas/Timestamps'
        - type: object
          required: [id, date, label, calendar_version, country]
          properties:
            id: { type: integer }
            date: { type: string, format: date }
            label: { type: string }
            calendar_version: { type: string }
            country: { type: string, example: CG }
    ReferentialItem:
      description: Élément de référentiel, selon `type`.
      oneOf:
        - $ref: '#/components/schemas/Agency'
        - $ref: '#/components/schemas/ProcessingEntity'
        - $ref: '#/components/schemas/Category'
        - $ref: '#/components/schemas/Product'
        - $ref: '#/components/schemas/ResponseTemplate'
        - $ref: '#/components/schemas/Holiday'
    ReferentialItemEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/ReferentialItem' }
    AgencyInput:
      type: object
      description: 'type = agencies. Obligatoires en création : code, name, city.'
      properties:
        code: { type: string, maxLength: 40, pattern: '^[A-Za-z0-9_-]+$', description: Unique. }
        name: { type: string, maxLength: 150 }
        city: { type: string, maxLength: 100 }
        is_active: { type: boolean }
    EntityInput:
      type: object
      description: 'type = entities. Obligatoires en création : code, name.'
      properties:
        code: { type: string, maxLength: 40, pattern: '^[A-Za-z0-9_-]+$', description: Unique. }
        name: { type: string, maxLength: 150 }
        is_active: { type: boolean }
    CategoryInput:
      type: object
      description: 'type = categories. Obligatoires en création : code, label.'
      properties:
        code: { type: string, maxLength: 40, pattern: '^[A-Za-z0-9_-]+$', description: Unique. }
        label: { type: string, maxLength: 150 }
        description: { type: [string, 'null'], maxLength: 2000 }
        is_active: { type: boolean }
    ProductInput:
      type: object
      description: 'type = products. Obligatoires en création : code, label.'
      properties:
        code: { type: string, maxLength: 40, pattern: '^[A-Za-z0-9_-]+$', description: Unique. }
        label: { type: string, maxLength: 150 }
        is_active: { type: boolean }
    TemplateInput:
      type: object
      description: 'type = templates. Obligatoires en création : code, kind, label, subject, body.'
      properties:
        code: { type: string, maxLength: 40, pattern: '^[A-Za-z0-9_-]+$' }
        kind: { $ref: '#/components/schemas/TemplateKind' }
        label: { type: string, maxLength: 150 }
        subject: { type: string, maxLength: 190 }
        body: { type: string, maxLength: 10000 }
        is_active: { type: boolean }
    HolidayInput:
      type: object
      description: 'type = holidays. Obligatoires en création : date, label, calendar_version.'
      properties:
        date: { type: string, format: date }
        label: { type: string, maxLength: 150 }
        calendar_version: { type: string, maxLength: 30, pattern: '^[A-Za-z0-9_.-]+$' }
    ReferentialInput:
      description: Corps selon le `type` de chemin (les champs inconnus du type sont ignorés).
      oneOf:
        - $ref: '#/components/schemas/AgencyInput'
        - $ref: '#/components/schemas/EntityInput'
        - $ref: '#/components/schemas/CategoryInput'
        - $ref: '#/components/schemas/ProductInput'
        - $ref: '#/components/schemas/TemplateInput'
        - $ref: '#/components/schemas/HolidayInput'
