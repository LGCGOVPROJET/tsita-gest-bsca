          description: Validation échouée (`ValidationError`) ou auto-modification interdite (`Error`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/Error'
