      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QualityActionInput' }
      responses:
        '200':
          description: Action à jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualityActionEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyApi' }
  /quality/recurring:
    get:
      tags: [Qualité]
      operationId: qualityRecurring
      summary: Regroupements récurrents (catégorie × produit) sur la période
      x-permissions: ['quality.manage OU quality.control OU reports.view']
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/AgencyId'
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/ProductId'
