        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyApi' }

  /reports/activity:
    get:
      tags: [Pilotage]
      operationId: reportActivity
      summary: Rapport d'activité et rapprochement du stock (JSON ou fichier)
      description: |
        Formule : stock_debut (veille de `from`) + entrées − réponses finales ± ajustements = stock_fin (au `to`).
        Sans `format` → JSON ; avec `format=csv|xlsx|pdf` → fichier binaire (export journalisé).
        La réponse inclut la dernière validation conformité correspondant exactement à la période et aux filtres.
        Période par défaut : 6 derniers mois.
      x-permissions: [reports.view]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/AgencyId'
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/Status'
        - name: format
          in: query
          description: Si présent, renvoie un fichier au lieu du JSON.
          schema: { $ref: '#/components/schemas/ExportFormat' }
      responses:
        '200':
          description: Rapport JSON, ou fichier si `format` est fourni.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ActivityReport' }
            text/csv:
              schema: { type: string }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet }
            application/pdf:
              schema: { type: string, contentMediaType: application/pdf }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyApi' }

  /reports/activity/validate:
    post:
      tags: [Pilotage]
      operationId: validateActivityReport
      summary: Valider un rapport d'activité (conformité)
      description: |
        Fige un instantané du rapprochement de stock pour la période et les filtres donnés
        (période par défaut appliquée si besoin), avec la version de règle applicable. Journalisé (`report.validate`).
        La dernière validation correspondante est ensuite renvoyée par `GET /reports/activity`.
      x-permissions: [reports.validate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string, format: date }
                to: { type: string, format: date, description: '≥ from.' }
                as_of: { type: [string, 'null'], format: date }
                filters:
                  type: [object, 'null']
                  properties:
                    agency_id: { type: [integer, 'null'], minimum: 1 }
                    entity_id: { type: [integer, 'null'], minimum: 1 }
                    category_id: { type: [integer, 'null'], minimum: 1 }
                    product_id: { type: [integer, 'null'], minimum: 1 }
                    channel: { type: [string, 'null'], description: Code de canal existant. }
                    status:
                      oneOf:
                        - $ref: '#/components/schemas/ComplaintStatus'
                        - type: 'null'
                comment: { type: [string, 'null'], maxLength: 2000 }
      responses:
        '201':
          description: Validation enregistrée.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ReportValidation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyApi' }

  # ------------------------------------------------------------------ Admin
